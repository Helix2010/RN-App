name: app-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：工作流只读取仓库；需要更多权限的 job 自己声明（安全评审 N28）
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 全部 action 固定到完整 commit SHA（tag 可被移动）；升级时改 SHA 并在注释里写对应版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/check-expo-doctor.mjs
      # 依赖漏洞体检（安全评审 N28）。当前是报告模式——有漏洞不挡发布，但 audit
      # 本身跑不起来会让这一步变红：静默失败的安全检查比没有这项检查更坏。
      # 定了 high/critical 的 SLA 与例外流程之后，加上 `--fail-on high`。
      - run: node scripts/check-dependency-audit.mjs


# 这里不构建 Android 包，也不持有任何签名材料。
#
# 正式包只由签名闸产出（RN-Server docs/design/android-signing-gate-2026-09-16.md）：
# amos 上的构建机用 `pnpm android:release` 出**未签名包**，签名闸检查后签名。仓库里
# 没有正式签名模式，GitHub 上也不应该有任何签名 secret——曾经的 android-release-gate
# 把裸密钥库和口令放在 secrets 里、每次推 main 都还原到托管 runner 的磁盘上，
# 2026-09-12 已移除，那批密钥随 2026-09 的签名密钥重置一并作废。
#
# SBOM 也在构建机上生成：构建机在 worktree 还在的时候调 scripts/build-sbom.mjs，
# 扫的是这次构建自己的依赖树，绑定的是**未签名包**的文件名与 sha256（签名闸签完后
# sha256 会变，发布记录的 file_metadata.unsignedSha256 把两者连起来）。生成失败整个
# 构建任务失败——它是发布门禁，不是可选步骤。
