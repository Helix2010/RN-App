name: app-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：工作流只读取仓库；需要更多权限的 job 自己声明（安全评审 N28）
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 全部 action 固定到完整 commit SHA（tag 可被移动）；升级时改 SHA 并在注释里写对应版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/check-expo-doctor.mjs
      # 依赖漏洞体检（安全评审 N28）。当前是报告模式——有漏洞不挡发布，但 audit
      # 本身跑不起来会让这一步变红：静默失败的安全检查比没有这项检查更坏。
      # 定了 high/critical 的 SLA 与例外流程之后，加上 `--fail-on high`。
      - run: node scripts/check-dependency-audit.mjs


# 曾经这里还有一个 android-release-gate：在 GitHub runner 上用生产签名密钥完整构建
# 一次 release APK。2026-09-12 移除。
#
# 不是因为它多余，是因为它和打包机那套设计直接冲突。`build-keystore seal` 的全部
# 意义是：密钥被运维的口令封成一个盒子，服务端打不开，封装口令只在打包机本地。而
# 那个 job 把**裸密钥库**（ANDROID_RELEASE_KEYSTORE_BASE64）连同 store 口令、alias、
# key 口令一起放在 GitHub secrets 里，每次推 main 都还原到托管 runner 的磁盘上。
# 拿到仓库写权限、或者供应链上任何一个 action 被投毒，就能把它取走——而 direct
# 分发下密钥泄漏没有补救办法：对方能签一个同包名的 APK 原地覆盖安装，钱包数据
# 原样留着，只能换包名让每个用户手动卸载重装。
#
# 现在正式包一律由 amos 上的打包机产出（租户在控制台发起任务）。
#
# 两件随之要做的事：
#   1. GitHub 上那四个 secret 要删掉——删 workflow 不会删 secret，密钥还在那里躺着。
#      ANDROID_RELEASE_KEYSTORE_BASE64 / ANDROID_RELEASE_STORE_PASSWORD /
#      ANDROID_RELEASE_KEY_ALIAS / ANDROID_RELEASE_KEY_PASSWORD
#   2. SBOM 已经挪到打包机（2026-09-12）：构建代理在 worktree 还在的时候调
#      scripts/build-sbom.mjs，扫的是这次构建自己的依赖树，绑的是真正发出去的那个
#      APK 的 sha256，随产物一起传回服务端，记在发布记录的 file_metadata.sbom 上。
#      生成失败整个构建任务失败——它是发布门禁，不是可选步骤。
