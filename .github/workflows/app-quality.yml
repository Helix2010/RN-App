name: app-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：工作流只读取仓库；需要更多权限的 job 自己声明（安全评审 N28）
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 全部 action 固定到完整 commit SHA（tag 可被移动）；升级时改 SHA 并在注释里写对应版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/check-expo-doctor.mjs
      # 依赖漏洞体检（安全评审 N28）。当前是报告模式——有漏洞不挡发布，但 audit
      # 本身跑不起来会让这一步变红：静默失败的安全检查比没有这项检查更坏。
      # 定了 high/critical 的 SLA 与例外流程之后，加上 `--fail-on high`。
      - run: node scripts/check-dependency-audit.mjs

  # 发布身份门禁（安全评审 N1 / N16 / N18 / N28）：用租户的生产签名密钥完整构建一次 release APK，
  # 并用 apksigner / aapt 复核签名者、包名、版本与权限。只在 main 与手动触发上跑，
  # 密钥来自受保护环境 android-release 的 secrets；没有配置 secrets 时这个 job 会失败，这是有意的。
  android-release-gate:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45
    env:
      TENANT: anyfun
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Materialise the release keystore from the secret store
        # secrets 只经 env 进入脚本，不做模板内插（避免进入日志与脚本文本）
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "ANDROID_RELEASE_KEYSTORE_BASE64 secret is not configured"; exit 1; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the release APK through the tenant gate
        # ANDROID_HOME 直接继承 runner 进程环境（ubuntu-latest 预装 SDK）；
        # 不能写 ${{ env.ANDROID_HOME }}：表达式里的 env 上下文只含工作流自己声明的变量，会把它覆盖成空串
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -d "$ANDROID_HOME" || { echo "ANDROID_HOME is not an installed SDK on this runner: '$ANDROID_HOME'"; exit 1; }
          pnpm android:release "$TENANT" --no-push
      - name: Re-verify the artifact independently of the build script
        run: pnpm android:verify artifacts/*.apk "$TENANT"
      # SBOM（安全评审 §12.2）：audit 回答"今天有哪些已知漏洞"，SBOM 回答"已经发出去的
      # 那个包里装的是哪个版本"。syft 按固定版本 + 固定 sha256 下载——为了做供应链安全
      # 而引入一个不固定的二进制是自相矛盾的，也因此不把它加进 package.json。
      - name: Generate the SBOM for the built artifact
        env:
          SYFT_VERSION: 1.51.1
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -sSLo "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" syft
          node scripts/build-sbom.mjs --tenant "$TENANT" \
            --syft "$RUNNER_TEMP/syft" --apk artifacts/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ env.TENANT }}
          path: artifacts/*-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
